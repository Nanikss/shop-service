spring.application.name=shop-service
# H2 in-memory by default. Run with --spring.profiles.active=postgres to use Postgres (see application-postgres.properties).
spring.datasource.url=jdbc:h2:mem:shop;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Local defaults only. In any shared environment set SHOP_JWT_SECRET, SHOP_WEBHOOK_SECRET and SHOP_ADMIN_PASSWORD.
shop.jwt.secret=local-dev-jwt-secret-at-least-32-bytes-long
shop.jwt.ttl=PT1H
shop.webhook.secret=local-dev-webhook-secret
shop.webhook.tolerance=PT5M
shop.admin.email=admin@shop.local
shop.admin.password=admin-local-only
